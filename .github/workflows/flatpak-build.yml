name: Flatpak Build
on:
  push:
    branches:
      - master
      - fix/workflow-builds
  pull_request:
    branches:
      - master

jobs:
  flatpak_build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-45
      options: --privileged
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v5
      with:
        bundle: hexchat.flatpak
        manifest-path: flatpak/io.github.Hexchat.json
        cache-key: flatpak-builder-${{ runner.os }}
