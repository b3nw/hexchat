name: Flatpak Build
on:
  push:
    branches:
      - master
      - fix/workflow-builds
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  flatpak_build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-45
      options: --privileged
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clone and fix shared-modules
      run: |
        # Clone shared-modules manually
        git clone https://github.com/flathub/shared-modules.git flatpak/shared-modules
        # Fix the JSON parse error in lua-5.3.5.json
        sed -i 's/|LUA_IDSIZE\t60/|LUA_IDSIZE\\t60/g' flatpak/shared-modules/lua5.3/lua-5.3.5.json
        sed -i 's/|LUA_IDSIZE\t512/|LUA_IDSIZE\\t512/g' flatpak/shared-modules/lua5.3/lua-5.3.5.json
        # Prefer https for 0pointer.de to avoid HTTP/port80 failures
        grep -RIl "0pointer.de" flatpak/shared-modules || true | xargs -r sed -i 's|http://0pointer.de/|https://0pointer.de/|g'

    - name: Build flatpak with retries
      run: |
        set -euo pipefail
        max_attempts=3
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt/$max_attempts"
          if xvfb-run --auto-servernum flatpak-builder \
             --repo=repo \
             --disable-rofiles-fuse \
             --install-deps-from=flathub \
             --force-clean \
             --default-branch=stable \
             --arch=x86_64 \
             --ccache flatpak_app \
             flatpak/flatpak-github-action-modified-io.github.Hexchat.json; then
            echo "flatpak-builder succeeded"
            break
          fi
          echo "flatpak-builder attempt $attempt failed"
          attempt=$((attempt+1))
          if [ $attempt -gt $max_attempts ]; then
            echo "All attempts failed"
            exit 1
          fi
          sleep $((attempt * 10))
        done
