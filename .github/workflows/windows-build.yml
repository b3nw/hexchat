name: Windows Build
on:
  push:
    branches:
      - master
      - feat/hexchat-python-313-win
      - fix/workflow-builds
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  windows_build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x64]
        arch: [x64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        uses: jwlawson/actions-setup-ccache@v2
        with:
          version: 'latest'
          upgrade: true

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.ccache
          key: ${{ runner.os }}-windows-ccache-${{ hashFiles('**/*.c', '**/*.h', '**/*.cpp', '**/*.vcxproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-windows-ccache-

      - name: Setup ccache
        run: |
          ccache --set-config=max_size=1.0G
          ccache --zero-stats
          echo "CCACHE_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64" >> $env:GITHUB_ENV
        shell: powershell

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Set Python3Path environment variable
        run: echo "Python3Path=$(python -c 'import sys; import os; print(os.path.normpath(sys.prefix))')" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install Dependencies
        run: |
          New-Item -Name "deps" -ItemType "Directory"

          Invoke-WebRequest http://files.jrsoftware.org/is/5/innosetup-5.5.9-unicode.exe -OutFile deps\innosetup-unicode.exe
          & deps\innosetup-unicode.exe /VERYSILENT | Out-Null

          Invoke-WebRequest https://github.com/hexchat/gvsbuild/releases/download/hexchat-2.16.2/idpsetup-1.5.1.exe -OutFile deps\idpsetup.exe
          & deps\idpsetup.exe /VERYSILENT

          # Use platform consistently for GTK download filename so OutFile matches URL
          $gtkFile = "deps\gtk-${{ matrix.platform }}.7z"
          Invoke-WebRequest https://github.com/hexchat/gvsbuild/releases/download/hexchat-2.16.2/gtk-${{ matrix.platform }}-2018-08-29-openssl1.1.7z -OutFile $gtkFile

          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z.exe' }

          & $sevenZip x $gtkFile -oC:\gtk-build\gtk

          # gendef
          Invoke-WebRequest https://github.com/hexchat/gvsbuild/releases/download/hexchat-2.16.2/gendef-20111031.7z -OutFile deps\gendef.7z
          & $sevenZip x deps\gendef.7z -oC:\gtk-build

          # WinSparkle
          Invoke-WebRequest https://github.com/hexchat/gvsbuild/releases/download/hexchat-2.16.2/WinSparkle-20151011.7z -OutFile deps\WinSparkle.7z
          & $sevenZip x deps\WinSparkle.7z -oC:\gtk-build\WinSparkle

          # perl per-arch
          Invoke-WebRequest https://github.com/hexchat/gvsbuild/releases/download/hexchat-2.16.2/perl-5.20.0-${{ matrix.arch }}.7z -OutFile deps\perl-${{ matrix.arch }}.7z
          & $sevenZip x deps\perl-${{ matrix.arch }}.7z -oC:\gtk-build\perl-5.20\${{ matrix.platform }}

          # Install cffi for Python 3.13
          python -m pip install --upgrade pip
          python -m pip install cffi
        shell: powershell

      - name: Install .NET Framework 4.6.1 Developer Pack
        run: choco install netfx-4.6.1-devpack -y

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show Python paths (debug)
        run: |
          echo Python executable: %PYTHON% || where python
          python -c "import sys, sysconfig, os; print('sys.prefix=', sys.prefix); p=sysconfig.get_paths(); print('Include:', p.get('include')); print('Platlib:', p.get('platlib')); print(os.path.exists(os.path.join(p.get('include'), 'Python.h')))"
        shell: cmd

      - name: Build
        run: |
          set CL= /clr
          msbuild win32\hexchat.sln /m /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:Python3Path="%Python3Path%" /p:UseClangCl=true
        shell: cmd

      - name: Show ccache statistics
        run: ccache --show-stats

      - name: List build output
        run: dir /s /b
        shell: cmd

      
      - name: Preparing Artifacts
        run: |
          if exist ..\hexchat-build\${{ matrix.platform }}\HexChat*.exe (
            move ..\hexchat-build\${{ matrix.platform }}\HexChat*.exe .\
          ) else (
            echo "Expected installer not found in ..\hexchat-build\${{ matrix.platform }}"
            dir ..\hexchat-build /s
            exit /b 1
          )
          move ..\hexchat-build .\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Installer ${{ matrix.arch }}
          path: HexChat*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Build Files ${{ matrix.arch }}
          path: hexchat-build

